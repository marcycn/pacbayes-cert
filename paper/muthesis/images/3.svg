)">allowed, via KL(Q || P)</text><path d="M1.58765-2.38436 395.512 259.914 392.337 264.683-1.58765 2.38436ZM397.731 248.314 413 275 382.489 271.203Z" transform="matrix(1 0 0 -1 3036 1267)"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 3133.98 1069)">allowed</text><path d="M792 1396 792 1577" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M792 1577 2681 1577" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M2.86458-5.71163e-06 2.8649 158.083-2.86427 158.084-2.86458 5.71163e-06ZM13.7503 153.5 0.000360892 181-13.7497 153.5Z" transform="matrix(1 0 0 -1 2681 1577)"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 2005.38 1524)">allowed</text><path d="M528 1396 528 1766" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M528 1766 3927 1766" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M2.86458-1.45607e-06 2.86493 687.083-2.86423 687.083-2.86458 1.45607e-06ZM13.7503 682.5 0.000360892 710-13.7497 682.5Z" transform="matrix(1 0 0 -1 3927 1766)"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 1962.58 1716)">allowed, via KL(Q || P)</text><rect x="182" y="1888" width="2491" height="468" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="#F2F2F2"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 201.3 2016)">Disjoint index sets are not enough.  A class</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1072.13 2016)">-</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1087.6 2016)">stratified split draws S</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="31" transform="matrix(1 0 0 1 1531.61 2033)">0</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1561.4 2016)">against label</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 201.3 2078)">counts taken over the whole of S, which contains S</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="31" transform="matrix(1 0 0 1 1228.54 2095)">b</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1245.73 2078)">, so the prior comes to depend</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 201.3 2139)">on the labels of S</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="31" transform="matrix(1 0 0 1 552.498 2156)">b</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 582.29 2139)">though the two subsets share no example.  A fixed</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1601.51 2139)">-</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 1616.98 2139)">quota sample</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 201.3 2201)">is also not the i.i.d. draw the bound assumes, whatever the quotas are computed from.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 201.3 2263)">The label</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 388.644 2263)">-</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="46" transform="matrix(1 0 0 1 404.112 2263)">independent partition of the corrected pipeline removes both faults.</text><rect x="2822" y="1888" width="1402" height="468" stroke="#000000" stroke-width="5.72917" stroke-linejoin="round" stroke-miterlimit="10" fill="#FFFFFF"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="48" transform="matrix(1 0 0 1 2841.3 2074)">solid arrow = permitted dependency</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="48" transform="matrix(1 0 0 1 2841.3 2140)">dashed arrow with </text><text font-family="Segoe UI Symbol,Segoe UI Symbol_MSFontService,sans-serif" font-weight="400" font-size="48" transform="matrix(1 0 0 1 3246.35 2140)">✕</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="48" transform="matrix(1 0 0 1 3299.06 2140)">= forbidden dependency</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="48" transform="matrix(1 0 0 1 2841.3 2207)">double border = reported quantity</text></g></svg>